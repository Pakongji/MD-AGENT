services:
  - type: web
    name: md-ai-agent
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AI_PROVIDER
        value: mock
      - key: OPENAI_API_KEY
        sync: false
